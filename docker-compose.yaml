version: '3.8'

services:
  postgres-products:
    image: postgres:16
    container_name: postgres-products
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products_db
    volumes:
      - pgdata-products:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d products_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-orders:
    image: postgres:16
    container_name: postgres-orders
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    volumes:
      - pgdata-orders:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orders_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: .
      dockerfile: ./products/Dockerfile
    command:
      - poetry
      - run
      - python
      - main.py
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres-products
      POSTGRES_PORT: 5432
      POSTGRES_DB: products_db
    depends_on:
      postgres-products:
        condition: service_healthy
  order-service:
    build:
      context: .
      dockerfile: ./orders/Dockerfile
    command:
      - poetry
      - run
      - python
      - main.py
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres-orders
      POSTGRES_PORT: 5432
      POSTGRES_DB: orders_db
      PRODUCT_SERVICE_URL: http://product-service:8000
    depends_on:
      postgres-orders:
        condition: service_healthy
volumes:
  pgdata-products:
  pgdata-orders: